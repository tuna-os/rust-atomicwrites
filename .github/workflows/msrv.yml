on: [push, pull_request]

name: MSRV

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        rust:
          - 1.63.0
          - stable
          - beta
          - nightly

    steps:
      - name: Checkout sources
        uses: actions/checkout@v2.8.0
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: actions-rs/toolchain@v1.0.7 # zizmor: ignore[archived-uses] replacing actions-rs would change the toolchain setup; kept as upstream has it
        with:
          toolchain: ${{ matrix.rust }}
          override: true

      # Cargo 1.63 resolves the newest dependencies, which need a newer
      # rustc. Cargo.toml declares rust-version, so stable cargo's MSRV-aware
      # resolver writes a lockfile that 1.63 can build. Cargo.toml keeps no
      # upper bounds: those would stop downstream graphs from unifying.
      - name: Resolve dependencies for the MSRV
        if: matrix.rust == '1.63.0'
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: cargo +stable generate-lockfile

      - name: Run cargo check
        if: matrix.rust != 'nightly'
        uses: actions-rs/cargo@v1.0.3 # zizmor: ignore[archived-uses] replacing actions-rs would change how cargo runs; kept as upstream has it
        with:
          command: check

      - name: Run cargo check (nightly)
        if: matrix.rust == 'nightly'
        continue-on-error: true
        uses: actions-rs/cargo@v1.0.3 # zizmor: ignore[archived-uses] replacing actions-rs would change how cargo runs; kept as upstream has it
        with:
          command: check

  test:
    needs: [check]
    name: Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        rust:
          - 1.63.0
          - stable
          - beta
          - nightly
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2.8.0
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: actions-rs/toolchain@v1.0.7 # zizmor: ignore[archived-uses] replacing actions-rs would change the toolchain setup; kept as upstream has it
        with:
          toolchain: ${{ matrix.rust }}
          override: true

      - name: Resolve dependencies for the MSRV
        if: matrix.rust == '1.63.0'
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: cargo +stable generate-lockfile

      - name: Run cargo test
        if: matrix.rust != 'nightly'
        uses: actions-rs/cargo@v1.0.3 # zizmor: ignore[archived-uses] replacing actions-rs would change how cargo runs; kept as upstream has it
        with:
          command: test

      - name: Run cargo test (nightly)
        if: matrix.rust == 'nightly'
        continue-on-error: true
        uses: actions-rs/cargo@v1.0.3 # zizmor: ignore[archived-uses] replacing actions-rs would change how cargo runs; kept as upstream has it
        with:
          command: test

  fmt:
    needs: [check]
    name: Rustfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        rust:
          - stable
          - beta
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2.8.0
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: actions-rs/toolchain@v1.0.7 # zizmor: ignore[archived-uses] replacing actions-rs would change the toolchain setup; kept as upstream has it
        with:
          toolchain: ${{ matrix.rust }}
          override: true

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Run cargo fmt
        uses: actions-rs/cargo@v1.0.3 # zizmor: ignore[archived-uses] replacing actions-rs would change how cargo runs; kept as upstream has it
        with:
          command: fmt
          args: --all -- --check

  clippy:
    needs: [check]
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2.8.0
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: actions-rs/toolchain@v1.0.7 # zizmor: ignore[archived-uses] replacing actions-rs would change the toolchain setup; kept as upstream has it
        with:
          toolchain: ${{ matrix.rust }}
          override: true

      - name: Install clippy
        run: rustup component add clippy

      - name: Run cargo clippy
        uses: actions-rs/cargo@v1.0.3 # zizmor: ignore[archived-uses] replacing actions-rs would change how cargo runs; kept as upstream has it
        with:
          command: clippy
          args: -- -D warnings
